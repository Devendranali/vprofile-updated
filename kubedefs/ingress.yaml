apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vprofile-ingress-v2  # different name
  namespace: vpro
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: vprofile.vanthiyadevan.local  # 👈 new unique host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vproapp-service
                port:
                  number: 8080
